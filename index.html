<style>
/* ===== EDITAR COLORES DE MARCA AQUÍ ===== */
:root{
  --bg:#160c14;          /* fondo principal */
  --bg-2:#20121c;        /* fondo de secciones alternas */
  --card:#2a1824;        /* tarjetas */
  --line:#3d2534;        /* bordes */
  --text:#fbeff3;        /* texto principal */
  --muted:#c9aebb;       /* texto secundario */
  --accent:#ff6f7d;      /* color de acción (botones) */
  --accent-2:#ffb36b;    /* color de apoyo (degradados, detalles) */
  --ok:#5fd39a;
  --radius:18px;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans);overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.15;margin:0 0 .5em}
h1{font-size:clamp(2.1rem,7vw,3.6rem)}
h2{font-size:clamp(1.7rem,5vw,2.6rem)}
h3{font-size:1.2rem}
p{margin:0 0 1em}
.wrap{width:min(1120px,100% - 2.5rem);margin-inline:auto}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--muted)}
.center{text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:3px;border-radius:8px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:52px;padding:.8em 1.5em;border-radius:999px;border:0;font:700 1rem var(--sans);text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s;color:#2a0a12;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 10px 30px -10px rgba(255,111,125,.7)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:none}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{min-height:42px;padding:.5em 1.1em;font-size:.92rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-flex;gap:.4em;align-items:center;padding:.35em .9em;border-radius:999px;background:rgba(255,111,125,.12);border:1px solid rgba(255,111,125,.35);font-size:.85rem;font-weight:500}

/* Header */
.top{position:sticky;top:0;z-index:30;background:rgba(22,12,20,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;min-height:64px;gap:1rem}
.logo{white-space:nowrap;font-family:var(--serif);font-weight:700;font-size:1.25rem;text-decoration:none;display:flex;align-items:center;gap:.4em}
.logo i{font-style:normal;color:var(--accent)}
.top nav{display:flex;gap:.5rem;align-items:center}
.top nav a.link{white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:500;padding:.5em .7em}
.top nav a.link:hover{color:var(--text)}
@media (max-width:560px){.top nav a.hide-m{display:none}.top nav a.link{padding:.5em .3em;font-size:.9rem}.top nav .btn.sm{padding:.5em .9em}}
@media (max-width:400px){.top nav a.link{display:none}}

/* Secciones landing */
section{padding:72px 0}
section.alt{background:var(--bg-2)}
.eyebrow{display:block;letter-spacing:.18em;text-transform:uppercase;font-size:.78rem;font-weight:700;color:var(--accent-2);margin-bottom:.6em}
.hero{padding:40px 0 64px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-30% -20% auto auto;width:620px;height:620px;background:radial-gradient(circle,rgba(255,111,125,.22),transparent 65%);pointer-events:none}
.hero-grid{display:grid;gap:40px;align-items:center}
.hero p.lead{font-size:1.12rem;color:var(--muted);max-width:36em}
.hero .ctas{display:flex;flex-wrap:wrap;gap:.75rem;margin:1.4rem 0 1rem}
.trust{font-size:.85rem;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
@media (min-width:900px){.hero-grid{grid-template-columns:1.1fr .9fr}.hero{padding:72px 0 96px}}

/* Mockup teléfono */
.mock{position:relative;margin-inline:auto;width:min(320px,86vw)}
.phone{border-radius:38px;padding:12px;background:#0d070b;border:1px solid var(--line);box-shadow:0 40px 80px -30px rgba(0,0,0,.8),0 0 0 6px rgba(255,255,255,.03)}
.screen{border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#2b1522,#170b13);padding:26px 18px;text-align:center;min-height:470px}
.screen .ph{height:150px;border-radius:16px;margin:14px 0;background:linear-gradient(135deg,#ff8a7a 0%,#c74b7a 55%,#5b2a6e 100%);position:relative;overflow:hidden}
.screen .ph::after{content:"♥";position:absolute;inset:0;display:grid;place-items:center;font-size:3rem;color:rgba(255,255,255,.55)}
.mini-count{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.mini-count div{background:rgba(255,255,255,.06);border-radius:10px;padding:8px 0}
.mini-count b{display:block;font:700 1.3rem var(--serif)}
.mini-count span{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.mock .float{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.55em .8em;font-size:.8rem;box-shadow:0 10px 30px -10px #000;display:flex;gap:.45em;align-items:center}
.mock .f1{left:-18px;top:90px}.mock .f2{right:-14px;bottom:-14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(95,211,154,.2)}

/* Grillas */
.grid{display:grid;gap:16px}
@media (min-width:640px){.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media (min-width:960px){.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.card .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.35rem;background:rgba(255,179,107,.12);margin-bottom:12px}
.card h3{margin-bottom:.3em}
.card p{color:var(--muted);margin:0;font-size:.95rem}
.step .num{font:700 2.4rem var(--serif);color:transparent;-webkit-text-stroke:1.5px var(--accent);line-height:1;margin-bottom:10px}
.list-check{list-style:none;padding:0;margin:0 0 1.2rem;display:grid;gap:.6rem}
.list-check li{display:flex;gap:.6em;align-items:flex-start}
.list-check li::before{content:"✓";flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(95,211,154,.15);color:var(--ok);font-weight:700;font-size:.8rem;margin-top:2px}
.head{max-width:640px;margin:0 auto 36px;text-align:center}
.head p{color:var(--muted)}

/* Testimonios (espacios para contenido real) */
.testi{border-style:dashed}
.testi .stars{color:var(--accent-2);letter-spacing:2px}
.testi q{display:block;font-family:var(--serif);font-style:italic;font-size:1.05rem;margin:.6em 0 1em;color:var(--muted)}

/* FAQ */
.faq{max-width:760px;margin:0 auto;display:grid;gap:10px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 18px}
.faq summary{cursor:pointer;list-style:none;padding:18px 0;font-weight:700;display:flex;justify-content:space-between;gap:1rem;min-height:44px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:1.4rem;line-height:1;color:var(--accent);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{color:var(--muted);padding-bottom:16px;margin:0}

/* Oferta */
.offer{max-width:560px;margin:0 auto;text-align:center;border-radius:26px;padding:34px 26px;background:linear-gradient(180deg,rgba(255,111,125,.14),rgba(255,179,107,.05));border:1px solid rgba(255,111,125,.4)}
.price{font:700 clamp(3rem,12vw,4.4rem)/1 var(--serif);margin:.2em 0}
.price small{font:500 1rem var(--sans);color:var(--muted)}
.offer .list-check{text-align:left;max-width:360px;margin-inline:auto}
.after{display:grid;gap:10px;text-align:left;max-width:380px;margin:1.5rem auto}
.after div{display:flex;gap:.8em;align-items:center}
.after b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:.85rem}

/* Footer */
footer.site{border-top:1px solid var(--line);padding:36px 0 110px;color:var(--muted);font-size:.9rem}
footer.site .wrap{display:grid;gap:18px}
footer.site nav{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem}
footer.site nav a{text-decoration:none;padding:.3em 0}
footer.site nav a:hover{color:var(--text)}
.reclamos{display:inline-flex;align-items:center;gap:.5em;border:1px solid var(--line);border-radius:10px;padding:.5em .9em;text-decoration:none;width:max-content}
@media (min-width:768px){footer.site{padding-bottom:40px}footer.site .wrap{grid-template-columns:1fr auto;align-items:center}}

/* CTA fija móvil + WhatsApp */
.sticky-cta{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(22,12,20,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;transform:translateY(110%);transition:transform .3s}
.sticky-cta.show{transform:none}
.sticky-cta .p{font-size:.8rem;color:var(--muted);line-height:1.2}
.sticky-cta .p b{display:block;color:var(--text);font-size:1.05rem}
.sticky-cta .btn{flex:1}
@media (min-width:768px){.sticky-cta{display:none}}
.wa{position:fixed;right:16px;bottom:88px;z-index:41;width:56px;height:56px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 10px 25px -8px rgba(0,0,0,.6);text-decoration:none}
.wa svg{width:30px;height:30px;fill:#fff}
@media (min-width:768px){.wa{bottom:24px;right:24px}}

/* ===== EDITOR ===== */
.editor{padding:28px 0 120px}
.editor .wrap{max-width:720px}
.steps{display:flex;gap:6px;margin:10px 0 26px}
.steps span{flex:1;height:6px;border-radius:9px;background:var(--line);transition:background .3s}
.steps span.on{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.step-label{font-size:.85rem;color:var(--muted);margin-bottom:4px}
.field{display:grid;gap:6px;margin-bottom:18px}
.field label{font-weight:700;font-size:.95rem}
.field .hint{font-size:.82rem;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=url],input[type=tel],textarea,select{width:100%;min-height:50px;padding:.75em 1em;border-radius:14px;border:1.5px solid var(--line);background:#1b0f18;color:var(--text);font:1rem var(--sans)}
textarea{min-height:220px;resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
input[type=date]{color-scheme:dark}input[type=time]{color-scheme:dark}
.row2{display:grid;gap:0 14px}
@media (min-width:560px){.row2{grid-template-columns:1fr 1fr}}
.err{color:#ff9aa5;font-size:.85rem;min-height:1.2em}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;min-height:210px;border:2px dashed rgba(255,111,125,.45);border-radius:22px;padding:28px 18px;text-align:center;cursor:pointer;background:linear-gradient(180deg,rgba(255,111,125,.08),rgba(255,179,107,.03));transition:border-color .2s,background .2s,transform .15s;-webkit-tap-highlight-color:transparent}
.drop:hover,.drop.over{border-color:var(--accent);background:rgba(255,111,125,.12)}
.drop:active{transform:scale(.99)}
.drop:focus-within{outline:3px solid var(--accent-2);outline-offset:3px}
.drop .cam{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 12px 30px -10px rgba(255,111,125,.8)}
.drop .cam svg{width:32px;height:32px;stroke:#2a0a12;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.drop .cta{display:inline-flex;align-items:center;min-height:48px;padding:.7em 1.4em;border-radius:999px;background:var(--text);color:#2a0a12;font-weight:700}
.drop .sub{font-size:.85rem;color:var(--muted)}
.drop.full{opacity:.5;pointer-events:none}
.drop.busy .cta{opacity:.6}
.photo-count{display:flex;justify-content:space-between;align-items:center;margin:14px 0 0;font-size:.9rem;color:var(--muted)}
.thumbs .add{display:grid;place-items:center;border:2px dashed var(--line);background:transparent;color:var(--muted);font-size:1.8rem;cursor:pointer;border-radius:12px;aspect-ratio:1}
.thumbs .add:hover{border-color:var(--accent);color:var(--accent)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.thumbs figure{margin:0;position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs figure button{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:1rem;cursor:pointer}
.thumbs .cover{position:absolute;left:6px;bottom:6px;font-size:.7rem;background:rgba(0,0,0,.65);padding:.15em .5em;border-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{min-height:40px;padding:.4em 1em;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--text);font:500 .9rem var(--sans);cursor:pointer}
.chip.on,.chip:hover{border-color:var(--accent);background:rgba(255,111,125,.1)}
.nav-steps{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(22,12,20,.95);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
.nav-steps .wrap{display:flex;gap:10px;max-width:720px}
.nav-steps .btn{flex:1}
.summary{display:grid;gap:8px;font-size:.95rem}
.summary div{display:flex;justify-content:space-between;gap:1rem;border-bottom:1px solid var(--line);padding:8px 0}
.summary div span:first-child{color:var(--muted)}
.summary div span:last-child{text-align:right;word-break:break-word}

/* Selector de canciones */
.song-list{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;max-height:430px;overflow-y:auto;padding-right:4px;margin-bottom:14px;overscroll-behavior:contain}
.song{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);cursor:pointer;text-align:left;color:var(--text);font:inherit;width:100%}
.song:hover{border-color:rgba(255,111,125,.5)}
.song.on{border-color:var(--accent);background:rgba(255,111,125,.1)}
.song img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;background:#000}
.song .meta{flex:1;min-width:0}
.song .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .meta small{color:var(--muted)}
.song .pv{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:var(--text);font-size:1rem;cursor:pointer}
.song .pv[aria-pressed=true]{background:var(--accent);color:#2a0a12}
.song .check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:transparent}
.song.on .check{background:var(--accent);border-color:var(--accent);color:#2a0a12}
.preview-box{border-radius:14px;overflow:hidden;aspect-ratio:16/9;background:#000;margin-bottom:14px}
.preview-box iframe{width:100%;height:100%;border:0;display:block}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem;margin:18px 0 12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
/* Recuerdos especiales (editor) */
.mem-edit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mem-card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.mem-card .ph{position:relative;aspect-ratio:1}
.mem-card .ph img{width:100%;height:100%;object-fit:cover}
.mem-card .ph button{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
.mem-card textarea{min-height:76px;border:0;border-top:1px solid var(--line);border-radius:0;font-size:.9rem;resize:none}
.mem-add{aspect-ratio:1;border:2px dashed var(--line);border-radius:18px;background:rgba(255,255,255,.02);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text);cursor:pointer;font:inherit;padding:10px;text-align:center}
.mem-add:hover{border-color:var(--accent)}
.mem-add .cam{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:rgba(255,111,125,.15)}
.mem-add .cam svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mem-add small{color:var(--muted)}
.mem-empty{font-style:italic;color:var(--muted);text-align:center;margin-top:14px}
/* Recuerdos especiales (página) */
.mems{margin-bottom:34px;text-align:center}
.mems h2{font-size:1.6rem}
.mem-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 14px;margin-top:14px}
.mem-grid .polaroid{width:calc(50% - 7px)}
.polaroid{margin:0;background:#fbf3ea;padding:8px 8px 12px;border-radius:6px;box-shadow:0 18px 30px -16px #000;transform:rotate(var(--r));transition:transform .3s}
.polaroid:hover{transform:rotate(0) scale(1.03)}
.polaroid button{display:block;width:100%;padding:0;border:0;cursor:zoom-in;aspect-ratio:1;overflow:hidden;background:#ddd}
.polaroid img{width:100%;height:100%;object-fit:cover}
.polaroid figcaption{font-family:var(--serif);font-style:italic;color:#3b2230;font-size:.92rem;line-height:1.35;margin-top:8px;overflow-wrap:anywhere}

/* Pago */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}
.tab{min-height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:700 .95rem var(--sans);cursor:pointer}
.tab.on{border-color:var(--accent);background:rgba(255,111,125,.1)}
.qr-ph{width:200px;aspect-ratio:1;margin:12px auto;border-radius:14px;border:2px dashed var(--line);display:grid;place-items:center;text-align:center;font-size:.8rem;color:var(--muted);padding:12px}
.note{font-size:.85rem;color:var(--muted);background:rgba(255,179,107,.08);border:1px solid rgba(255,179,107,.25);border-radius:12px;padding:12px 14px}
.test-box{margin-top:22px;border:1px dashed #6b5a2a;border-radius:14px;padding:14px;background:rgba(255,214,107,.05)}

/* Listo */
.qr-box{background:#fff;border-radius:20px;padding:18px;width:min(280px,80vw);margin:0 auto 18px}
.qr-box canvas{width:100%;height:auto;display:block;image-rendering:pixelated}
.share{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.my-list{display:grid;gap:12px}
.my-item{display:flex;gap:14px;align-items:center}
.my-item .th{width:64px;height:64px;border-radius:12px;flex:none;background:linear-gradient(135deg,var(--accent),#5b2a6e) center/cover}
.my-item .info{flex:1;min-width:0}
.my-item .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:.72rem;padding:.15em .6em;border-radius:6px;font-weight:700}
.tag.ok{background:rgba(95,211,154,.15);color:var(--ok)}
.tag.pend{background:rgba(255,179,107,.15);color:var(--accent-2)}

/* ===== PÁGINA DE LA PAREJA ===== */
body.lp{background:#12090f}
.lp-bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:rgba(18,9,15,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);font-size:.85rem}
.lp-bar .langs{display:flex;gap:2px}
.lp-bar .langs button{min-width:38px;min-height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);font:700 .78rem var(--sans);cursor:pointer}
.lp-bar .langs button.on{background:var(--card);color:var(--text)}
.lp-banner{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#2a0a12;text-align:center;font-weight:700;font-size:.85rem;padding:8px}
.lp-main{max-width:640px;margin:0 auto;padding:22px 18px 60px;position:relative;z-index:1}
.music{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:28px}
.music .disc{flex:none;width:58px;height:58px;border-radius:50%;background:conic-gradient(from 0deg,#2a1824,#5b2a6e,#ff6f7d,#2a1824);position:relative}
.music .disc::after{content:"";position:absolute;inset:22px;border-radius:50%;background:#12090f}
.music.playing .disc{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.music .t{flex:1;min-width:0}
.music .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music .t small{color:var(--muted)}
.music .play{flex:none;width:50px;height:50px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#2a0a12;font-size:1.1rem}
.player-slot{margin:-14px 0 28px}
.player-slot iframe{width:100%;border:0;border-radius:14px;display:block}
.yt-frame{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;max-height:0;opacity:0;transition:max-height .4s,opacity .4s}
.yt-frame.show{max-height:420px;opacity:1}
.yt-frame iframe,.yt-frame>div{position:absolute;inset:0;width:100%;height:100%}
.music .play[aria-pressed=true]{background:var(--text)}
.song-ok{display:flex;gap:12px;align-items:center;margin-top:10px;padding:10px;border-radius:14px;background:rgba(95,211,154,.08);border:1px solid rgba(95,211,154,.3);font-size:.9rem}
.song-ok img{width:80px;aspect-ratio:16/9;object-fit:cover;border-radius:8px}
.music-hint{font-size:.82rem;color:var(--muted);text-align:center;margin:-18px 0 26px}
.names{text-align:center;margin:10px 0 8px}
.names h1{font-size:clamp(2.6rem,12vw,4.2rem);margin:0}
.names .amp{display:block;font-family:var(--serif);font-style:italic;color:var(--accent);font-size:1.8rem;line-height:1.2}
.since{text-align:center;color:var(--muted);margin-bottom:30px}
.since b{color:var(--text);display:block;font-family:var(--serif);font-size:1.25rem;font-weight:500}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 34px}
.gallery button{padding:0;border:0;border-radius:14px;overflow:hidden;cursor:zoom-in;aspect-ratio:1;background:var(--card)}
.gallery button:first-child{grid-column:span 2;aspect-ratio:4/3}
.gallery img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.gallery button:hover img{transform:scale(1.04)}
.demo-photo{width:100%;height:100%;display:grid;place-items:center;font-size:2.4rem;color:rgba(255,255,255,.6)}
.counter-box{background:linear-gradient(180deg,rgba(255,111,125,.12),rgba(42,24,36,.6));border:1px solid var(--line);border-radius:24px;padding:26px 16px;text-align:center;margin-bottom:34px}
.counter-box h2{font-size:1.6rem;margin-bottom:.2em}
.counter{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.counter div{background:rgba(0,0,0,.25);border-radius:16px;padding:14px 4px}
.counter b{display:block;font:700 clamp(1.8rem,8vw,2.4rem)/1.1 var(--serif);font-variant-numeric:tabular-nums}
.counter span{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.letter{background:#fbf3ea;color:#3b2230;border-radius:20px;padding:30px 24px;font-family:var(--serif);font-size:1.08rem;line-height:1.75;box-shadow:0 30px 60px -30px #000;margin-bottom:34px;position:relative}
.letter::before{content:"“";position:absolute;top:-10px;left:16px;font-size:5rem;line-height:1;color:var(--accent)}
.letter p{margin:0 0 1em;white-space:pre-line}
.letter .sign{text-align:right;font-style:italic;margin:1.2em 0 0}
.lp-share{text-align:center;margin-bottom:34px}
.lp-share .share{margin-top:12px}
.lp-foot{text-align:center;color:var(--muted);font-size:.85rem;padding:30px 0}
.hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.hearts span{position:absolute;bottom:-40px;color:var(--accent);opacity:.0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.35}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}}
dialog.lightbox{border:0;padding:0;background:transparent;max-width:94vw;max-height:90vh}
dialog.lightbox::backdrop{background:rgba(0,0,0,.88)}
dialog.lightbox img{max-width:94vw;max-height:84vh;border-radius:14px;margin:auto}
dialog.lightbox button{display:block;margin:12px auto 0;min-height:44px}

/* Reveal sutil */
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}
.rv.in{opacity:1;transform:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#fff;color:#2a0a12;font-weight:700;padding:.7em 1.2em;border-radius:999px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>
</head>

const CONFIG = {

};

/* ===================================================================
   UTILIDADES
   =================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200); }
function track(ev, data){ try{ window.fbq && fbq("trackCustom", ev, data); window.gtag && gtag("event", ev, data); }catch(e){} }

/* UTM: se guardan al entrar y se adjuntan a los mensajes de WhatsApp */
(function saveUtm(){
  const p = new URLSearchParams(location.search); const u = {};
  ["utm_source","utm_medium","utm_campaign","utm_content","utm_term"].forEach(k => p.get(k) && (u[k] = p.get(k)));
  if (Object.keys(u).length) sessionStorage.setItem("li_utm", JSON.stringify(u));
})();
function utmText(){ try{ const u = JSON.parse(sessionStorage.getItem("li_utm") || "{}"); return Object.keys(u).length ? "\n(" + Object.values(u).join(" / ") + ")" : ""; }catch(e){ return ""; } }
function waLink(text){ return "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(text + utmText()); }
function baseUrl(){ return location.href.split("#")[0]; }

/* ===================================================================
   ALMACENAMIENTO (prototipo: IndexedDB del navegador)
   Para producción: reemplazar Store por llamadas a tu backend
   (ej. Supabase/Firebase) manteniendo los mismos métodos.
   =================================================================== */
const Store = {
  _db: null,
  _mem: new Map(),   // respaldo en memoria si el navegador bloquea IndexedDB (ej. vista previa de archivos)
  open(){ return this._db || (this._db = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error("sin indexedDB"));
    const r = indexedDB.open("loren-ipsum", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("pages", { keyPath: "id" });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  })); },
  async tx(mode, fn){ let db; try{ db = await this.open(); }catch(e){ return this.memTx(fn); } return new Promise((res, rej) => { const t = db.transaction("pages", mode); const s = t.objectStore("pages"); const out = fn(s); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); }); },
  memTx(fn){ const m = this._mem; const s = { get: id => ({ result: m.get(id) }), getAll: () => ({ result: [...m.values()] }), put: v => (m.set(v.id, v), {}), delete: id => (m.delete(id), {}) }; const o = fn(s); return Promise.resolve(o && o.result); },
  get(id){ return this.tx("readonly", s => s.get(id)); },
  all(){ return this.tx("readonly", s => s.getAll()); },
  save(p){ p.updated = Date.now(); return this.tx("readwrite", s => s.put(p)); },
  del(id){ return this.tx("readwrite", s => s.delete(id)); }
};

/* Enlace portátil: los textos de la página (sin fotos) van comprimidos dentro del enlace.
   Así el QR funciona desde cualquier celular aunque el prototipo no tenga servidor. */
const b64u = {
  enc: bytes => { let s = ""; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); },
  dec: str => { str = str.replace(/-/g,"+").replace(/_/g,"/"); while (str.length % 4) str += "="; const bin = atob(str); return Uint8Array.from(bin, c => c.charCodeAt(0)); }
};
async function pack(obj){
  const data = new TextEncoder().encode(JSON.stringify(obj));
  if (!window.CompressionStream) return "u" + b64u.enc(data);
  const buf = await new Response(new Blob([data]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer();
  return "z" + b64u.enc(new Uint8Array(buf));
}
async function unpack(str){
  const kind = str[0], bytes = b64u.dec(str.slice(1));
  let data = bytes;
  if (kind === "z") data = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(data));
}
function portableData(p){ return { a: p.a, b: p.b, d: p.date, t: p.time || "", s: p.song, l: p.letter, g: p.sign, f: p.from, lg: p.lang || "es" }; }
function fromPortable(o){ return { a: o.a, b: o.b, date: o.d, time: o.t, song: o.s || {}, letter: o.l, sign: o.g, from: o.f, lang: o.lg, photos: [], paid: true, portable: true }; }
async function shareUrl(p){ return baseUrl() + "#/v/" + await pack(portableData(p)); }

   =================================================================== */
function qrCanvas(text, size = 600, margin = 2){
  qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
  const qr = qrcode(0, "L"); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), cells = n + margin * 2, px = Math.floor(size / cells), real = px * cells;
  const c = document.createElement("canvas"); c.width = c.height = real;
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, real, real); x.fillStyle = "#1b0f18";
  for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) if (qr.isDark(r, col)) x.fillRect((col + margin) * px, (r + margin) * px, px, px);
  return c;
}

/* Tarjeta imprimible 1080x1350 */
function cardCanvas(p, url){
  const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d");
  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, "#2b1522"); g.addColorStop(1, "#12090f"); x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.strokeStyle = "rgba(255,179,107,.55)"; x.lineWidth = 4; x.strokeRect(40, 40, W - 80, H - 80);
  x.textAlign = "center"; x.fillStyle = "#ff6f7d"; x.font = "64px Georgia, serif"; x.fillText("♥", W / 2, 170);
  x.fillStyle = "#c9aebb"; x.font = "500 34px 'DM Sans', Arial, sans-serif"; x.fillText("Para " + (p.b || ""), W / 2, 240);
  x.fillStyle = "#fbeff3"; let fs = 88; const title = `${p.a} & ${p.b}`; do { x.font = `700 ${fs}px Fraunces, Georgia, serif`; fs -= 4; } while (x.measureText(title).width > W - 180 && fs > 40); x.fillText(title, W / 2, 350);
  const q = qrCanvas(url, 560, 2); const qs = 560; x.fillStyle = "#fff"; roundRect(x, (W - qs) / 2 - 20, 420, qs + 40, qs + 40, 36); x.fill(); x.drawImage(q, (W - qs) / 2, 440, qs, qs);
  x.fillStyle = "#fbeff3"; x.font = "500 40px 'DM Sans', Arial, sans-serif"; x.fillText("Escanea para descubrir nuestra historia", W / 2, 1110);
  x.fillStyle = "#c9aebb"; x.font = "italic 34px Georgia, serif"; x.fillText("Juntos desde " + fmtDate(p.date, "es"), W / 2, 1170);
  x.fillStyle = "rgba(201,174,187,.7)"; x.font = "26px 'DM Sans', Arial, sans-serif"; x.fillText(CONFIG.brand, W / 2, 1260);
  return c;
}
function roundRect(x, X, Y, w, h, r){ x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }

function startDate(p){ const [y, m, d] = (p.date || "2020-01-01").split("-").map(Number); const [hh, mm] = (p.time || "00:00").split(":").map(Number); return new Date(y, m - 1, d, hh || 0, mm || 0); }
function diff(from, to = new Date()){
  if (to < from) return { y: 0, mo: 0, d: 0, h: 0, mi: 0, s: 0 };
  const addM = n => { const a = new Date(from); a.setMonth(from.getMonth() + n); return a; };
  let total = (to.getFullYear() - from.getFullYear()) * 12 + (to.getMonth() - from.getMonth());
  let anchor = addM(total); while (anchor > to){ total--; anchor = addM(total); }
  let ms = to - anchor; const d = Math.floor(ms / 864e5); ms -= d * 864e5;
  const h = Math.floor(ms / 36e5); ms -= h * 36e5; const mi = Math.floor(ms / 6e4); ms -= mi * 6e4;
  return { y: Math.floor(total / 12), mo: total % 12, d, h, mi, s: Math.floor(ms / 1000) };
}
const pad = n => String(n).padStart(2, "0");
function fmtDate(iso, lang){ if (!iso) return ""; const loc = { es: "es-PE", en: "en-US", pt: "pt-BR", it: "it-IT" }[lang] || "es-PE"; const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString(loc, { day: "numeric", month: "long", year: "numeric" }); }

      else if (list.length > room) er.textContent = `Solo se agregaron ${room}. Máximo ${CONFIG.maxPhotos} fotos.`;

    inp.onchange = () => add(inp.files);

  function bindSong(){

    let playing = null;
    const preview = (id, btn) => {

  function bindMemories(){
    const box = $("#memEdit"), inp = $("#fm"), er = $("#er");
    const cam = '<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="14" r="3.5"/></svg>';
    const draw = () => {

      box.innerHTML = p.memories.map((m, i) => `<div class="mem-card"><div class="ph"><img src="${m.img}" alt="Recuerdo ${i + 1}"><button type="button" data-memrm="${i}" aria-label="Quitar recuerdo ${i + 1}">✕</button></div><textarea data-memtxt="${i}" maxlength="120" placeholder="Ej. Nuestro primer viaje juntos" aria-label="Mensaje del recuerdo ${i + 1}">${esc(m.text || "")}</textarea></div>`).join("")
        + (n < CONFIG.maxMemories ? `<button type="button" class="mem-add" id="memAdd"><span class="cam" aria-hidden="true">${cam}</span><b>Agregar recuerdo</b><small>${n} de ${CONFIG.maxMemories} fotos</small></button>` : "");
      if (!n) box.insertAdjacentHTML("afterend", "");

    inp.onchange = async () => {

    box.oninput = e => { const t = e.target.closest("[data-memtxt]"); if (t){ p.memories[+t.dataset.memtxt].text = t.value; } };
    box.onchange = () => saveDraft().catch(() => {});
    box.onclick = e => { const b = e.target.closest("[data-memrm]"); if (b){ p.memories.splice(+b.dataset.memrm, 1); draw(); saveDraft().catch(() => {}); } };

  function bindLetter(){
    const ta = $("#fx"), cnt = $("#cnt"); const upd = () => cnt.textContent = ta.value.length; ta.oninput = upd; upd();
    $$("[data-l]").forEach(b => b.onclick = () => {
      if (ta.value.trim() && !confirmReplace()) return;

  function collect(){
    const er = $("#er"); const v = id => ($("#" + id)?.value || "").trim();
    if (step === 0){
      p.a = v("fa"); p.b = v("fb"); p.date = v("fd"); p.time = v("ft"); p.lang = v("fl") || "es";
      if (!p.a || !p.b) return er.textContent = "Escribe los dos nombres.", false;
      if (!p.date) return er.textContent = "Elige la fecha en que empezó su historia.", false;
      if (new Date(p.date) > new Date()) return er.textContent = "La fecha no puede ser futura.", false;
      if (!p.sign) p.sign = p.a;
    }
    if (step === 2){ $$("[data-memtxt]").forEach(t => { const m = p.memories[+t.dataset.memtxt]; if (m) m.text = t.value.trim(); }); }
    if (step === 3){
      const pasted = v("su");

      if (!p.song.url) return er.textContent = "Elige una canción de la lista o pega un enlace.", false;
    }
    if (step === 4){
      p.letter = $("#fx").value.trim(); p.sign = v("fs") || p.a;
      if (!p.letter) return er.textContent = "Escribe tu carta o elige una sugerencia.", false;
    }
    return true;
  }

  $("#next").onclick = async () => {
    if (!collect()) return;
    await saveDraft();
    if (step < STEPS.length - 1){ step++; paint(); window.scrollTo(0, 0); return; }
    localStorage.removeItem("li_draft");
    track("editor_completo", {});
    location.hash = p.paid ? "#/listo/" + p.id : "#/pagar/" + p.id;
  };
  $("#prev").onclick = () => { collect(); saveDraft(); if (step){ step--; paint(); } };
  paint();
}

/* Reduce fotos a máx 1280px (más rápido con datos móviles) */
async function shrink(file, max = 1280, q = .8){
  const toCanvas = (src, w, h) => { const k = Math.min(1, max / Math.max(w, h)); const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k); c.getContext("2d").drawImage(src, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", q); };
  // 1) Método rápido (respeta la orientación de la foto)
  if (window.createImageBitmap){
    try{ const bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); const out = toCanvas(bmp, bmp.width, bmp.height); bmp.close && bmp.close(); return out; }catch(e){}
  }
  // 2) Respaldo: leer como dataURL (funciona en visores de iPhone y navegadores antiguos)
  const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  return new Promise((res, rej) => {
    const img = new Image(); const t = setTimeout(() => rej(new Error("timeout")), 15000);
    img.onload = () => { clearTimeout(t); try{ res(toCanvas(img, img.naturalWidth, img.naturalHeight)); }catch(e){ rej(e); } };
    img.onerror = () => { clearTimeout(t); rej(new Error("formato")); };
    img.src = dataUrl;
  });
}

/* YouTube / Spotify → URL embebible */
function mediaEmbed(u){
  if (!u) return null;
  try{
    const url = new URL(u), host = url.hostname.replace(/^www\.|^m\./, "");
    if (host === "youtu.be"){ const id = url.pathname.slice(1).split("/")[0]; if (/^[\w-]{6,}$/.test(id)) return { type: "yt", id, src: `https://www.youtube.com/embed/${id}` }; }
    if (host.endsWith("youtube.com")){
      const id = url.searchParams.get("v") || (url.pathname.match(/\/(shorts|embed|live)\/([\w-]+)/) || [])[2];
      if (id && /^[\w-]{6,}$/.test(id)) return { type: "yt", id, src: `https://www.youtube.com/embed/${id}` };
    }
    if (host === "open.spotify.com"){
      const m = url.pathname.match(/(track|album|playlist|episode)\/([\w]+)/);
      if (m) return { type: "sp", src: `https://open.spotify.com/embed/${m[1]}/${m[2]}` };
    }
  }catch(e){}
  return null;
}

/* ===================================================================
   REPRODUCTOR DE YOUTUBE (API oficial de IFrame)
   - Se prepara al abrir la página para que el primer toque suene al
     instante (necesario en iPhone).
   - El video se muestra al reproducir: las normas de YouTube no permiten
     ocultar el reproductor.
   =================================================================== */
let ytApi = null;
function loadYouTubeApi(){
  if (ytApi) return ytApi;
  return ytApi = new Promise((res, rej) => {
    if (window.YT && YT.Player) return res(YT);
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { prev && prev(); res(YT); };
    const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; s.onerror = rej; document.head.appendChild(s);
  });
}
function mountYouTube(id, tr){
  const btn = $("#play"), card = $("#mus"), frame = $("#ytFrame");
  let player = null, ready = false, wantPlay = false;
  const setState = playing => {
    card.classList.toggle("playing", playing); btn.textContent = playing ? "❚❚" : "▶";
    btn.setAttribute("aria-pressed", playing); btn.setAttribute("aria-label", playing ? tr().pause : tr().play);
    if (playing){ frame.classList.add("show"); const h = $("#mh"); if (h) h.hidden = true; }
  };
  loadYouTubeApi().then(YT => {
    if (!document.body.contains(frame)) return;
    player = new YT.Player("ytPlayer", {
      videoId: id, width: "100%", height: "100%",
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1, loop: 1, playlist: id },
      events: {
        onReady: () => { ready = true; if (wantPlay) player.playVideo(); },
        onStateChange: e => setState(e.data === 1 || e.data === 3),
        onError: () => { frame.classList.add("show"); toast("No se pudo reproducir la canción"); }
      }
    });
    cleanup.push(() => { try{ player.destroy(); }catch(e){} });
  }).catch(() => { btn.onclick = () => window.open("https://youtu.be/" + id, "_blank", "noopener"); });
  btn.onclick = () => {
    frame.classList.add("show");
    if (!ready){ wantPlay = true; btn.textContent = "…"; return; }
    const st = player.getPlayerState();
    if (st === 1 || st === 3) player.pauseVideo(); else player.playVideo();
  };
}

addEventListener("DOMContentLoaded", route);
</script>
